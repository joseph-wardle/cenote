[package]
name = "cenote-cli"
description = "Headless batch renderer over the cenote core library"
# The package grew a second bin (`cenote-flip`), which made every documented
# `cargo run -p cenote-cli` ambiguous — this keeps them working as written.
default-run = "cenote-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.103"
cenote = { path = "../cenote" }
cenote-pbrt = { path = "../cenote-pbrt" }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
# NVIDIA FLIP, the repo's one perceptual image metric (already the goldens'
# in crates/cenote's tests): the `cenote-flip` bin wraps it so the Hydra
# harness FLIP-compares usdrecord's EXR against the checked-in golden through
# the same code the in-process goldens use — no second FLIP dependency.
nv-flip = "0.1.2"
# The `edit-latency` sidecar, in the format every other file the repo writes
# is in. Pinned to the core's exact ron for the same reason it is pinned
# there: minor releases have shipped breaking changes.
ron = "=0.12.2"
serde = { version = "1.0.228", features = ["derive"] }

[features]
# Builds `render --denoise` (the flag itself always parses, and names
# this feature when the build lacks it).
denoise = ["cenote/denoise"]
# Measurement kernels: `render` also writes a `.probes.ron` sidecar with
# the volume stage's scatter-event histogram. Never a perf build — see the
# feature's note in crates/cenote/Cargo.toml.
probes = ["cenote/probes"]

[lints]
workspace = true
