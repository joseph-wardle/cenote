# Lean CI: format, lint, build, non-GPU tests.
# Rendering needs a GPU that runners don't have — golden-image tests detect
# this and skip; they run locally as the documented pre-push ritual.
# cargo build runs slangc over every kernel (crates/cenote/build.rs), so
# shader breakage fails CI even without a GPU. The slangc version is pinned
# below; bump it deliberately, together with the local install.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SLANG_VERSION: "2026.9.1"
      OIDN_RELEASE: "2.4.1"
      CLANG_FORMAT_VERSION: "22.1.8"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install slangc (pinned)
        run: |
          curl -fsSL -o /tmp/slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          mkdir -p "$HOME/.slang"
          tar -xzf /tmp/slang.tar.gz -C "$HOME/.slang"
          echo "$HOME/.slang/bin" >> "$GITHUB_PATH"
      # Every build links OpenImageDenoise, so this comes before the build,
      # not after it. Ubuntu doesn't package OIDN; the official release is
      # pinned here the same way slangc is above — and it is the only source
      # that carries the CUDA device the interactive path needs. CI's runner
      # has no GPU, so its filter test runs the CPU fallback.
      - name: Install OpenImageDenoise (pinned)
        run: |
          curl -fsSL -o /tmp/oidn.tar.gz \
            "https://github.com/RenderKit/oidn/releases/download/v${OIDN_RELEASE}/oidn-${OIDN_RELEASE}.x86_64.linux.tar.gz"
          mkdir -p "$HOME/.oidn"
          tar -xzf /tmp/oidn.tar.gz -C "$HOME/.oidn" --strip-components=1
          echo "OIDN_DIR=$HOME/.oidn" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/.oidn/lib" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      # The C++ half of the wire drift guard: hydra/wire builds standalone —
      # no USD, no GPU — and its corpus test byte-compares the mirror against
      # the Rust goldens checked in under crates/cenote-wire. std::println
      # needs GCC 14's libstdc++, one past the runner default; apt carries
      # exactly one g++-14 per Ubuntu release, so the package name is the pin.
      # clang-format output shifts between majors, and apt stops short of the
      # local install's release, so the PyPI wheel pins the exact version.
      - name: Install g++-14 (pinned)
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Install clang-format (pinned)
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: C++ format
        run: find hydra \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0r clang-format --dry-run -Werror
      - name: Wire mirror (build + ctest)
        run: |
          cmake -S hydra/wire -B build/wire -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build/wire --parallel
          ctest --test-dir build/wire --output-on-failure
